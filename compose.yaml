# Usage:
#   mkdir -p state config && sudo chown 10001:10001 state
#   cp config.example.toml config/config.toml && chmod 600 config/config.toml
#   cp .env.example .env && chmod 600 .env        # then fill in the two secrets
#   docker compose run --rm o365mig plan
#   docker compose run --rm o365mig migrate
#   docker compose run --rm o365mig verify
#   docker compose run --rm o365mig cleanup
# Web UI (optional):
#   docker compose up -d web
#   docker compose logs web       # the URL with its token; open it as http://127.0.0.1:8080/

# One definition for both services, so the web UI can never run with weaker hardening.
x-o365mig: &o365mig
  build: .
  image: o365-to-mailcow:latest
  env_file: .env
  volumes:
    - ./state:/state
    - ./config:/config:ro
  read_only: true
  # bounded memory: per mailbox about prefetch_budget_mib + max_message_bytes, x parallel_mailboxes
  mem_limit: 4g
  pids_limit: 256
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  o365mig:
    <<: *o365mig
    command: ["plan"]

  web:
    <<: *o365mig
    # All interfaces inside the container, but published on the host's loopback only:
    # reachable from this machine, nowhere else. Never publish it on 0.0.0.0.
    command: ["web", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:8080:8080"
